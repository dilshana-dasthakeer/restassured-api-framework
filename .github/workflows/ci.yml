name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 21 * * *" # nightly, 02:30 in Sri Lanka
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run smoke suite
        run: mvn -B -ntp test -Dsuite=smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-smoke
          path: target/surefire-reports/
          retention-days: 14

  regression:
    name: Regression
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run regression suite
        run: mvn -B -ntp test -Dsuite=regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-regression
          path: target/surefire-reports/
          retention-days: 14
